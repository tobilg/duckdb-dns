#
# Weekly check for a new duckdb-neo release and open a PR bumping DuckDB everywhere
#
name: Update DuckDB
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Scheduled workflows are disabled after 60 days without repository activity; re-enable on every run
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/UpdateDuckDB.yml/enable"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Detect versions
        id: v
        run: |
          crate=$(curl -sf -A 'duckdb-dns-updater' https://crates.io/api/v1/crates/duckdb-neo | jq -er '.crate.max_stable_version')
          current=$(grep -oP '^duckdb-neo = \{ version = "~?\K[^"]+' Cargo.toml)
          # crate 0.20000.0 -> DuckDB v2.0.0
          if ! [[ "$crate" =~ ^[0-9]+\.[0-9]{5,}\.[0-9]+$ ]]; then
            echo "::error::Unexpected duckdb-neo crate version '$crate'"
            exit 1
          fi
          n=$(echo "$crate" | cut -d. -f2)
          duckdb="v$((n / 10000)).$((n / 100 % 100)).$((n % 100))"
          # duckdb-neo pins its macro crate; use that requirement, not an unrelated latest release.
          macros=$(curl -sf -A 'duckdb-dns-updater' "https://crates.io/api/v1/crates/duckdb-neo/$crate/dependencies" | jq -er '.dependencies[] | select(.crate_id == "duckdb-loadable-macros" and .kind == "normal") | .req | ltrimstr("=")')
          if ! [[ "$macros" =~ ^[0-9]+\.[0-9]{5,}\.[0-9]+$ ]]; then
            echo "::error::Unexpected duckdb-loadable-macros requirement '$macros'"
            exit 1
          fi
          old_duckdb=v$(grep -oP '^DUCKDB_TEST_VERSION\?=\K.+' Makefile)
          echo "crate=$crate current=$current duckdb=$duckdb old_duckdb=$old_duckdb"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "macros=$macros" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "duckdb=$duckdb" >> "$GITHUB_OUTPUT"
          echo "old_duckdb=$old_duckdb" >> "$GITHUB_OUTPUT"
          if [ "$crate" != "$current" ]; then echo "update=true" >> "$GITHUB_OUTPUT"; fi
          # Crate-only release: DuckDB itself is unchanged
          if [ "$duckdb" = "$old_duckdb" ]; then
            echo "title=Update duckdb-neo to $crate" >> "$GITHUB_OUTPUT"
            echo "branch=update-duckdb-crate-$crate" >> "$GITHUB_OUTPUT"
          else
            echo "title=Update DuckDB to $duckdb" >> "$GITHUB_OUTPUT"
            echo "branch=update-duckdb-$duckdb" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump versions
        if: steps.v.outputs.update == 'true'
        env:
          CRATE: ${{ steps.v.outputs.crate }}
          MACROS: ${{ steps.v.outputs.macros }}
          DUCKDB: ${{ steps.v.outputs.duckdb }}
          OLD_DUCKDB: ${{ steps.v.outputs.old_duckdb }}
        run: |
          sed -i -E "s/^(duckdb-neo = \{ version = \")[^\"]+/\1~$CRATE/; s/^(duckdb-loadable-macros = \{ version = \")[^\"]+/\1~$MACROS/" Cargo.toml
          # The v2 C API requires matching crate, entrypoint, metadata, CI and test versions.
          sed -i "s/^TARGET_DUCKDB_VERSION=.*/TARGET_DUCKDB_VERSION=$DUCKDB/" Makefile
          sed -i "s/^DUCKDB_TEST_VERSION?=.*/DUCKDB_TEST_VERSION?=${DUCKDB#v}/" Makefile
          sed -i -E "s/(api_version = \")v[0-9.]+/\1$DUCKDB/" src/lib.rs
          sed -i -E "s/(duckdb_version: )v.*/\1$DUCKDB/" .github/workflows/MainDistributionPipeline.yml

          # Bump extension patch version
          ext=$(grep -oP '^version = "\K[^"]+' Cargo.toml | head -1)
          new_ext="${ext%.*}.$(( ${ext##*.} + 1 ))"
          sed -i "s/^version = \"$ext\"/version = \"$new_ext\"/" Cargo.toml
          echo "NEW_EXT=$new_ext" >> "$GITHUB_ENV"

          # CI tools use codename release branches when an exact release ref is unavailable.
          ci_tools=$(git config -f .gitmodules submodule.extension-ci-tools.branch)
          if [ "${DUCKDB%.*}" != "${OLD_DUCKDB%.*}" ]; then
            if git -C extension-ci-tools ls-remote --exit-code --heads origin "$DUCKDB" > /dev/null; then
              ci_tools=$DUCKDB
            else
              refs=$(git -C extension-ci-tools ls-remote --heads origin "refs/heads/${DUCKDB%.*}-*")
              ci_tools=$(echo "$refs" | awk '{sub("refs/heads/", "", $2); print $2}')
              if [ -z "$ci_tools" ] || [ "$(echo "$ci_tools" | wc -l)" -ne 1 ]; then
                echo "::error::Cannot identify a unique CI tools release branch for $DUCKDB"
                exit 1
              fi
            fi
          fi
          sed -i -E "s/@v[0-9]+\.[0-9]+[-.][A-Za-z0-9.]+/@$ci_tools/; s/(ci_tools_version: )v.*/\1$ci_tools/" .github/workflows/MainDistributionPipeline.yml
          git config -f .gitmodules submodule.extension-ci-tools.branch "$ci_tools"
          echo "CI_TOOLS=$ci_tools" >> "$GITHUB_ENV"

          # Move extension-ci-tools to the matching release branch
          git -C extension-ci-tools fetch --depth 1 origin "$ci_tools"
          git -C extension-ci-tools checkout FETCH_HEAD

          cargo update -p duckdb-neo -p duckdb-loadable-macros -p libduckdb-sys -p dns

      # A failing check still opens the PR, but as a draft, since the crate API changed and src/ needs fixing
      - name: Cargo check
        id: check
        if: steps.v.outputs.update == 'true'
        continue-on-error: true
        run: cargo check --locked

      - name: Open PR
        if: steps.v.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # CI on PRs opened with GITHUB_TOKEN waits for manual approval; set UPDATE_PR_TOKEN (PAT) to run it automatically
          token: ${{ secrets.UPDATE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ${{ steps.v.outputs.branch }}
          title: ${{ steps.v.outputs.title }}
          commit-message: ${{ steps.v.outputs.title }}
          draft: ${{ steps.check.outcome == 'failure' && 'always-true' || 'false' }}
          body: |
            Automated bump:
            - `duckdb-neo` → `${{ steps.v.outputs.crate }}`
            - `duckdb-loadable-macros` → `${{ steps.v.outputs.macros }}`
            - DuckDB entrypoint, metadata, CI and tests → `${{ steps.v.outputs.duckdb }}`
            - `extension-ci-tools` submodule → `${{ env.CI_TOOLS }}`
            - extension version → `${{ env.NEW_EXT }}`

            ${{ steps.check.outcome == 'failure' && '**:warning: `cargo check` failed**: the crate API likely changed, so `src/` needs fixing before this can be merged.' || '`cargo check` passed.' }}

            After merge, bump `ref` in duckdb/community-extensions `extensions/dns/description.yml`.
          delete-branch: true
