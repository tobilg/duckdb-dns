[package]
name = "dns"
version = "0.6.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb-neo = { version = "~0.20000.0", default-features = false, features = ["build-extension"] }
duckdb-loadable-macros = { version = "~1.20000.0", features = ["neo"] }
tokio = { version = "1.52", features = ["rt", "net", "macros", "rt-multi-thread", "sync"] }
hickory-resolver = "0.26.1"
hickory-proto = "0.26.1"
futures = "0.3.32"
once_cell = "1.21.4"
arc-swap = "1.9.1"
